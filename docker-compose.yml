services:
  postgres:
    image: postgres:16-alpine
    container_name: architecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: architecture-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: architecture-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI for inspecting emails
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATA_FILE: ""

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: architecture-app
    restart: unless-stopped
    ports:
      - "40001:40001"
    environment:
      NODE_ENV: production
      PORT: 40001
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-token-for-docker-compose-production-test-12345
      APP_URL: http://localhost:40001
      CORS_ORIGIN: http://localhost:40001
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

